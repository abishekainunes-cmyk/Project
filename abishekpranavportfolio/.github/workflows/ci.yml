name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Deterministic Dependency Installation
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Execute Vitest Test Suite
        run: npm run test

      - name: Production Bundle Compilation
        run: npm run build
